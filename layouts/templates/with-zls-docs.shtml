<extend template="base.shtml">
<head id="head">
	<style>
		#content {
			display: flex;
			flex-direction: row;
			gap: 1rem;
			max-width: inherit;
			width: min(100%, 1200px);
			margin-top: 50px;
		}
		
		#main {
			flex-grow: 1;
		}
		
		#main > h1 {
			margin-top: 0;
		}
		
		#main-header {
			flex-direction: row;
			gap: 1rem;
			margin: 0.5rem 0px;
		}
		
		#main-header p {
			font-size: smaller;
			text-align: center;
			padding: 0.5rem;
			border-radius: 0.8rem;
			border: 1px dashed var(--border-color);
		}
		
		#sidebar {
			flex: 0 0 15rem;
		}
		
		#sidebar summary {
			border-top: 1px solid var(--border-color);
			padding: 0.5rem 0.5rem;
			font-weight: bold;
			cursor: default;
		}
		
		#sidebar ul {
			list-style: none;
			padding-left: 0.25rem;
			margin: 0 0 0.5rem 0.75rem;
			border-left: 1px solid var(--border-color);
		}
		
		#sidebar li {
			margin: 0;
		}
		
		#sidebar a {
			display: block;
			padding: 0.5rem;
			color: inherit;
		}
		
		#sidebar .selected {
			text-decoration: underline;
		}
		
		#sidebar a:hover,
		#sidebar details > summary:hover  {
			background-color: var(--tertiary-background-color);
		}
		
		#sidebar-content {
			position: sticky;
			top: 40px;
			max-height: calc(100vh - 40px);
			overflow-y: auto;
			scrollbar-width: thin;
		}
		
		#footer {
			display: flex;
			flex-wrap: wrap;
			margin-top: 3rem;
			padding: 0.25rem;
			border-top: 1px solid var(--border-color);
		}
		
		#footer a {
			text-decoration: none;
			color: inherit;
			padding: 0.25rem;
		}
		
		#footer .title {
			font-weight: bold;
			text-decoration: underline;
		}
		
		@media (max-width: 1000px) {
			#content {
				flex-direction: column-reverse;
			}
		}
	</style>
	<super>
</head>
<div id="content">
	<nav id="sidebar">
		<div id="sidebar-content">
			<a href="$site.page('zls/install').link()">Install ZLS</a>
			<a href="$site.page('zls/releases').link()">Releases</a>
			<ctx :loop="$site.page('zls').custom.get('docs-sidebar')">
				<details open>
					<summary :text="$loop.it.at(0)"></summary>
					<ul :loop="$loop.it.at(1)">
						<ctx item="$site.page('zls', $loop.it)">
							<li>
								<a class="$ctx.item.isCurrent().then('selected')"
								   href="$ctx.item.link()"
								   :text="$ctx.item.title"
								></a>
							</li>
						</ctx>
					</ul>
				</details>
			</ctx>
		</div>
	</nav>
	<div id="main">
		<h1 :text="$page.title"></h1>
		<super>
		<nav id="footer">
			<ctx :if="$page.prevPage?()">
				<a href="$if.link()" style="margin-right: auto;">
					<p>
						←
						<span class="title" :text="$if.title"></span>
					</p>
				</a>
			</ctx>
			<ctx :if="$page.nextPage?()">
				<a href="$if.link()" style="margin-left: auto; text-align: right;">
					<p>
						<span class="title" :text="$if.title"></span>
						→
					</p>
				</a>
			</ctx>
		</nav>
	</div>
</div>
